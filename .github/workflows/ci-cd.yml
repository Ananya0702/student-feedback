name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lint
        run: flake8 . --max-line-length=100 --exclude=.venv

      - name: Unit tests
        run: PYTHONPATH=. pytest -v

  build-and-deploy:
    name: Build & Push Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/ananya0702/student-feedback:latest

      - name: Smoke test container
        run: |
          docker run -d -p 5000:5000 --name app ghcr.io/ananya0702/student-feedback:latest
          sleep 5
          curl --fail http://localhost:5000/health

      - name: Push image
        run: |
          IMAGE=ghcr.io/ananya0702/student-feedback
          docker tag $IMAGE:latest $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}